name: release-checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      CONCLAVE_TEST_DATABASE_URL: postgresql://conclave_test@127.0.0.1:5432/conclave_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: conclave_test
          POSTGRES_DB: conclave_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conclave_test -d conclave_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          package_json_file: package.json
      - name: Verify publication guard
        run: python3 scripts/test-publish-guard.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install media processing runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Verify frontend
        run: |
          pnpm typecheck
          pnpm lint:portable
          pnpm test:demo
          pnpm test:canvas
          pnpm test:auth
          pnpm test:gateway
          pnpm test:gateway-origin
          pnpm test:guards
          pnpm test:solana
          pnpm test:solana-core
          pnpm test:solana-token
          pnpm test:program-reader
          pnpm test:solana-serialized
          pnpm test:solana-raw
          pnpm test:solana-presign
          pnpm test:custody
          pnpm test:receipts
          pnpm test:crosscheck
          pnpm test:client-identity
          pnpm test:client-passkeys
          pnpm test:account-records
          pnpm test:client-workspace
          pnpm test:model-routing
          pnpm test:client-model-routing
          pnpm test:client-solana
          pnpm test:client-program-reader
          pnpm test:client-presign
          pnpm test:client-crosscheck
          pnpm test:client-deposits
          pnpm test:deposit-payment-pure
          pnpm test:client-deposit-payment
          pnpm test:brief-document
          pnpm test:brief-synthesis
          pnpm test:client-brief-synthesis
          pnpm test:readiness
          pnpm test:money-properties
          pnpm test:monitor
          pnpm test:token-burn
          pnpm test:token-deposit
          pnpm test:associated-token
          pnpm test:media-crypto
          pnpm test:media-content
          pnpm test:media-receipts
          pnpm test:client-media
          pnpm test:studio-review
          pnpm test:media-download
          pnpm test:media
          pnpm test:media-sanitize
          pnpm test:runtime
          node scripts/check-database.mjs --self-test
          pnpm test:database
          pnpm build
          pnpm test:runtime --bundle

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action (v2.3.9, ff98106e4c7b2bc287b24eaf42907196329070c7) needs a
      # license key for organization-owned repositories, so the gitleaks binary is
      # installed from a pinned release and verified by checksum instead.
      - name: Scan full history for secrets (gitleaks v8.30.1)
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --exit-code 1 .
      - name: Install Semgrep (1.180.0)
        run: pipx install semgrep==1.180.0
      - name: Static analysis (Semgrep)
        run: |
          semgrep scan \
            --config p/typescript --config p/javascript --config p/secrets \
            --metrics=off --error --exclude node_modules --exclude dist --exclude public \
            .
