name: production-source

on:
  push:
    branches: [codex/live-production-source]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CONCLAVE_DEPLOY_TARGET: node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
      - name: Verify deployed source hashes
        run: node scripts/verify-production-source.mjs
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types and feature gates
        run: |
          pnpm typecheck
          pnpm check:feature-release
      - name: Build production runtime
        run: pnpm build
