<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Conclave architecture: browser to web API to PostgreSQL; inference worker runs approved jobs through a model gateway and streams answers. Provider credentials stay server-side."><rect width="1200" height="620" rx="18" fill="#f5f2e9"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20221b}.mono{font-family:monospace;letter-spacing:2px}.small{font-size:16px}.label{font-size:20px;font-weight:700}.muted{fill:#686a60}</style><text x="46" y="46" font-size="16" class="mono">UNDER THE SURFACE</text><text x="46" y="91" font-size="34" >One room. Clear responsibilities.</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#888b80"/></marker></defs><path d="M310 202H405" fill="none" stroke="#888b80" stroke-width="2" marker-end="url(#arrow)"/><path d="M685 202H780" fill="none" stroke="#888b80" stroke-width="2" marker-end="url(#arrow)"/><path d="M920 252V310H545V352" fill="none" stroke="#888b80" stroke-width="2" marker-end="url(#arrow)"/><path d="M685 402H780" fill="none" stroke="#888b80" stroke-width="2" marker-end="url(#arrow)"/><path d="M445 352V252" fill="none" stroke="#888b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="46" y="152" width="264" height="100" rx="10" fill="#ffffff"/><text x="68" y="193" font-size="23" font-weight="bold" style="fill:#20221b">Browser</text><text x="68" y="224" font-size="15" style="fill:#20221b">Chat · comparisons · approval</text><rect x="405" y="152" width="280" height="100" rx="10" fill="#ffffff"/><text x="427" y="193" font-size="23" font-weight="bold" style="fill:#20221b">Web API</text><text x="427" y="224" font-size="15" style="fill:#20221b">Sessions · quotes · owned data</text><rect x="780" y="152" width="374" height="100" rx="10" fill="#e74432"/><text x="802" y="193" font-size="23" font-weight="bold" style="fill:#ffffff">PostgreSQL</text><text x="802" y="224" font-size="15" style="fill:#ffffff">Ledger · holds · jobs · encrypted content</text><rect x="405" y="352" width="280" height="100" rx="10" fill="#ffffff"/><text x="427" y="393" font-size="23" font-weight="bold" style="fill:#20221b">Inference worker</text><text x="427" y="424" font-size="15" style="fill:#20221b">Approved, leased jobs</text><rect x="780" y="352" width="374" height="100" rx="10" fill="#ffffff"/><text x="802" y="393" font-size="23" font-weight="bold" style="fill:#20221b">Model gateway</text><text x="802" y="424" font-size="15" style="fill:#20221b">One gateway → processing providers</text><text x="46" y="554" font-size="17" >Provider credentials stay server-side. The browser receives streamed answers.</text><text x="46" y="583" font-size="15" class="muted">Standard requests are visible to the gateway and model provider; this is not end-to-end encryption.</text></svg>