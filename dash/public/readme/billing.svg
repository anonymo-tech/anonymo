<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="394" viewBox="0 0 1200 394" role="img" aria-label="Illustrative billing flow: approve and hold 0.02 dollars, capture 0.0105 dollars including a five percent fee, release 0.0095 dollars."><rect width="1200" height="394" rx="18" fill="#f5f2e9"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20221b}.mono{font-family:monospace;letter-spacing:2px}.small{font-size:16px}.label{font-size:20px;font-weight:700}.muted{fill:#686a60}</style><text x="46" y="46" font-size="16" class="mono">THE COST OF A THOUGHT</text><text x="46" y="90" font-size="32" >Approve a ceiling. Settle the actual cost.</text><rect x="46" y="130" width="262" height="180" rx="10" fill="#ffffff"/><text x="68" y="164" font-size="17" class="mono" style="fill:#e74432">01</text><text x="68" y="201" font-size="20" font-weight="bold" style="fill:#20221b">QUOTE</text><text x="68" y="236" font-size="14" style="fill:#20221b">Maximum approved</text><text x="68" y="278" font-size="26" style="fill:#20221b">$0.020000</text><rect x="328" y="130" width="262" height="180" rx="10" fill="#ffffff"/><text x="350" y="164" font-size="17" class="mono" style="fill:#e74432">02</text><text x="350" y="201" font-size="20" font-weight="bold" style="fill:#20221b">HOLD</text><text x="350" y="236" font-size="14" style="fill:#20221b">Reserved before execution</text><text x="350" y="278" font-size="26" style="fill:#20221b">$0.020000</text><rect x="610" y="130" width="262" height="180" rx="10" fill="#20221b"/><text x="632" y="164" font-size="17" class="mono" style="fill:#e74432">03</text><text x="632" y="201" font-size="20" font-weight="bold" style="fill:#ffffff">CAPTURE</text><text x="632" y="236" font-size="14" style="fill:#ffffff">Usage + 5% platform fee</text><text x="632" y="278" font-size="26" style="fill:#ffffff">$0.010500</text><rect x="892" y="130" width="262" height="180" rx="10" fill="#ffffff"/><text x="914" y="164" font-size="17" class="mono" style="fill:#e74432">04</text><text x="914" y="201" font-size="20" font-weight="bold" style="fill:#20221b">RELEASE</text><text x="914" y="236" font-size="14" style="fill:#20221b">Unused reserve returned</text><text x="914" y="278" font-size="26" style="fill:#20221b">$0.009500</text><text x="46" y="355" font-size="14" class="mono">ILLUSTRATIVE ONLY  /  $0.010000 model usage + $0.000500 fee. No charge is made.</text></svg>