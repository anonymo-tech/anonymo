# Anonymo upstream tiers and routes (Backend §4, Overview §2-§4). Seed with:
#   bun scripts/seed-upstreams.ts config/upstreams.yaml
# Base URLs and keys come from the environment (base_url_env / api_key_env); keys are stored encrypted with APP_SECRET.
# In production every upstream listed here must have its key set, or seeding refuses to run.
#
# Launch setup: PayPerQ (PPQ) only, one account. The full multi-provider layout (Venice T0, self-hosted spares, Phala,
# Chutes, NanoGPT, Featherless) lives in test/fixtures/upstreams-multi.yaml; copy upstreams and routes from it to add one.
#
# Product rules the loader enforces (src/providers/tiers.ts):
#   - Venice models are never relabelled one-for-one: no direct_id on a Venice route or a reseller's venice/... model
#   - anonymo-1: every T0 family has a warm backup of the same family on another tier (no T0 route here, so no backup)
#   - anonymo-sealed: only routes on an upstream with a TEE (none here: the lane answers 409 sealed_unavailable)
#   - anonymo-rp: self-hosted routes only (none here: the lane is off)
#   - every prepaid upstream has a wallet-balance alarm (warn_usd alarms, drain_usd drains its routes)
#
# Checked against PPQ's public /v1/models list and docs on 2026-11-16, not yet with a live key. Unverified:
#   - whether PPQ forwards venice_parameters (without include_venice_system_prompt: false, Venice may prepend its own
#     system prompt), so the PPQ adapter sends none
#   - the balance reply's shape (path "balance" is a guess)
version: 1

scoring:
  t0_bonus: 25            # points for a healthy T0 route
  latency_per_s: 5        # points per second of median time to first token (5-minute window)
  error_penalty: 100      # points at a 100% error rate (5-minute window)
  cost_per_usd_m: 2       # points per USD of blended cost per 1M tokens
  healthy_max_error_rate: 0.25
  sticky_ttl_s: 1800      # key + conversation prefix stay on their route this long while it is healthy

canaries:
  interval_s: 45          # per upstream x model (spec: every 30-60 s)
  timeout_s: 15
  concurrency: 8

upstreams:
  # ---- T2 · PayPerQ: chat runs in PPQ's attested enclave router; the venice/... models below are badged zdr ----------
  - id: ppq
    name: PayPerQ
    kind: ppq
    tier: 2
    base_url: https://api.ppq.ai/v1
    base_url_env: PPQ_BASE_URL
    api_key_env: PPQ_API_KEY
    data_policy: { training: false, retains_prompts: false, retention_days: 0, zdr: true }
    prepaid: true
    # POST /credits/balance {"credit_id": ...}. The credit id is an account-level credential, kept apart from the API key.
    balance: { warn_usd: 50, drain_usd: 2, key_env: PPQ_CREDIT_ID }

routes:
  # Venice-hosted models resold by PPQ (about 5% over Venice's price). Pooled under anonymo-1 and the council only, never
  # as a direct model ID. Venice serves all three, so a Venice outage takes down every route here.
  - { id: ppq-venice-uncensored, upstream: ppq, model: venice/venice-uncensored-1-2, family: mistral, quant: fp16, ctx: 32768, price: { in: 0.211, out: 0.9495 }, quality: 82, serves: [anonymo-1, anonymo-council] }
  - { id: ppq-venice-deepseek-flash, upstream: ppq, model: venice/deepseek-v4-1-flash-uncensored, family: deepseek, quant: fp8, ctx: 131072, price: { in: 0.34815, out: 1.3926 }, quality: 86, serves: [anonymo-1, anonymo-council] }
  - { id: ppq-venice-gemma, upstream: ppq, model: venice/gemma-4-uncensored, family: gemma, quant: unknown, ctx: 131072, price: { in: 0.1714375, out: 0.5275 }, quality: 76, serves: [anonymo-1, anonymo-council] }
