rule_files:
  - alerts.yml
evaluation_interval: 30s
tests:
  - name: healthy
    interval: 30s
    input_series:
      - series: up{job="anonymo",instance="router:8787"}
        values: 1x8
      - series: anonymo_ready{job="anonymo",instance="router:8787"}
        values: 1x8
      - series: anonymo_readiness_check{job="anonymo",instance="router:8787",check="settlement"}
        values: 1x8
    alert_rule_test:
      - eval_time: 1m
        alertname: AnonymoUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoUnavailable
        exp_alerts: []
      - eval_time: 1m
        alertname: AnonymoNotReady
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoNotReady
        exp_alerts: []
      - eval_time: 1m
        alertname: AnonymoDependencyFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoDependencyFailed
        exp_alerts: []
      - eval_time: 1m
        alertname: AnonymoeadinessMetricsMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoeadinessMetricsMissing
        exp_alerts: []
  - name: failed scrape
    interval: 30s
    input_series:
      - series: up{job="anonymo",instance="router:8787"}
        values: "0x8"
    alert_rule_test:
      - eval_time: 1m
        alertname: AnonymoUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoUnavailable
        exp_alerts:
          - exp_labels:
              job: anonymo
              instance: router:8787
              severity: critical
            exp_annotations:
              summary: Anonymo readiness metrics cannot be reached
      - eval_time: 1m
        alertname: AnonymoNotReady
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoNotReady
        exp_alerts: []
      - eval_time: 1m
        alertname: AnonymoDependencyFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoDependencyFailed
        exp_alerts: []
      - eval_time: 1m
        alertname: AnonymoeadinessMetricsMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoeadinessMetricsMissing
        exp_alerts: []
  - name: missing target
    interval: 30s
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        alertname: AnonymoUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoUnavailable
        exp_alerts:
          - exp_labels:
              job: anonymo
              severity: critical
            exp_annotations:
              summary: Anonymo readiness metrics cannot be reached
      - eval_time: 1m
        alertname: AnonymoNotReady
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoNotReady
        exp_alerts: []
      - eval_time: 1m
        alertname: AnonymoDependencyFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoDependencyFailed
        exp_alerts: []
      - eval_time: 1m
        alertname: AnonymoeadinessMetricsMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoeadinessMetricsMissing
        exp_alerts: []
  - name: not ready
    interval: 30s
    input_series:
      - series: up{job="anonymo",instance="router:8787"}
        values: 1x8
      - series: anonymo_ready{job="anonymo",instance="router:8787"}
        values: "0x8"
    alert_rule_test:
      - eval_time: 1m
        alertname: AnonymoUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoUnavailable
        exp_alerts: []
      - eval_time: 1m
        alertname: AnonymoNotReady
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoNotReady
        exp_alerts:
          - exp_labels:
              job: anonymo
              instance: router:8787
              severity: critical
            exp_annotations:
              summary: Anonymo cannot safely accept traffic
      - eval_time: 1m
        alertname: AnonymoDependencyFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoDependencyFailed
        exp_alerts: []
      - eval_time: 1m
        alertname: AnonymoeadinessMetricsMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoeadinessMetricsMissing
        exp_alerts: []
  - name: missing readiness payload
    interval: 30s
    input_series:
      - series: up{job="anonymo",instance="router:8787"}
        values: 1x8
    alert_rule_test:
      - eval_time: 1m
        alertname: AnonymoUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoUnavailable
        exp_alerts: []
      - eval_time: 1m
        alertname: AnonymoNotReady
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoNotReady
        exp_alerts: []
      - eval_time: 1m
        alertname: AnonymoDependencyFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoDependencyFailed
        exp_alerts: []
      - eval_time: 1m
        alertname: AnonymoeadinessMetricsMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoeadinessMetricsMissing
        exp_alerts:
          - exp_labels:
              job: anonymo
              instance: router:8787
              severity: critical
            exp_annotations:
              summary: Anonymo scrape succeeded without readiness evidence
  - name: failed worker
    interval: 30s
    input_series:
      - series: up{job="anonymo",instance="router:8787"}
        values: 1x8
      - series: anonymo_ready{job="anonymo",instance="router:8787"}
        values: 1x8
      - series: anonymo_readiness_check{job="anonymo",instance="router:8787",check="settlement"}
        values: "0x8"
    alert_rule_test:
      - eval_time: 1m
        alertname: AnonymoUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoUnavailable
        exp_alerts: []
      - eval_time: 1m
        alertname: AnonymoNotReady
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoNotReady
        exp_alerts: []
      - eval_time: 1m
        alertname: AnonymoDependencyFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoDependencyFailed
        exp_alerts:
          - exp_labels:
              job: anonymo
              instance: router:8787
              check: settlement
              severity: critical
            exp_annotations:
              summary: Anonymo dependency or worker readiness failed
      - eval_time: 1m
        alertname: AnonymoeadinessMetricsMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoeadinessMetricsMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoBackupStale
        exp_alerts: []
  - name: stale backup
    interval: 30s
    input_series:
      - series: up{job="anonymo",instance="router:8787"}
        values: 1x8
      - series: anonymo_ready{job="anonymo",instance="router:8787"}
        values: "0x8"
      - series: anonymo_readiness_check{job="anonymo",instance="router:8787",check="database"}
        values: 1x8
      - series: anonymo_readiness_check{job="anonymo",instance="router:8787",check="backup_fresh"}
        values: "0x8"
    alert_rule_test:
      - eval_time: 1m
        alertname: AnonymoBackupStale
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoBackupStale
        exp_alerts:
          - exp_labels:
              job: anonymo
              instance: router:8787
              check: backup_fresh
              severity: critical
            exp_annotations:
              summary: Anonymo has no verified off-host backup inside its freshness window
      - eval_time: 3m
        alertname: AnonymoDependencyFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoUnavailable
        exp_alerts: []
  - name: fresh backup
    interval: 30s
    input_series:
      - series: up{job="anonymo",instance="router:8787"}
        values: 1x8
      - series: anonymo_ready{job="anonymo",instance="router:8787"}
        values: 1x8
      - series: anonymo_readiness_check{job="anonymo",instance="router:8787",check="backup_fresh"}
        values: 1x8
    alert_rule_test:
      - eval_time: 3m
        alertname: AnonymoBackupStale
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoNotReady
        exp_alerts: []
      - eval_time: 3m
        alertname: AnonymoDependencyFailed
        exp_alerts: []
  - name: chain incident drill
    interval: 30s
    input_series:
      - series: up{job="anonymo-chain",instance="127.0.0.1:9797"}
        values: 1x8
      - series: anonymo_chain_monitor_ok{job="anonymo-chain",instance="127.0.0.1:9797"}
        values: 1x8
      - series: anonymo_chain_authority_changed{job="anonymo-chain",component="credits"}
        values: 1x4 0x4
      - series: anonymo_chain_pause_changed{job="anonymo-chain",component="credits"}
        values: 1x4 0x4
      - series: anonymo_chain_outflow_over_limit{job="anonymo-chain",component="usdg"}
        values: 1x4 0x4
      - series: anonymo_chain_keeper_underfunded{job="anonymo-chain",component="keeper"}
        values: 1x4 0x4
    alert_rule_test:
      - eval_time: 2m
        alertname: AnonymoAuthorityChanged
        exp_alerts:
          - exp_labels: {job: anonymo-chain, component: credits, severity: critical}
            exp_annotations: {summary: Contract authority changed or differs from the reviewed owner policy}
      - eval_time: 2m
        alertname: AnonymoPauseChanged
        exp_alerts:
          - exp_labels: {job: anonymo-chain, component: credits, severity: warning}
            exp_annotations: {summary: "A contract pause policy changed; verify the incident and preserve exits"}
      - eval_time: 2m
        alertname: AnonymoLargeOutflow
        exp_alerts:
          - exp_labels: {job: anonymo-chain, component: usdg, severity: critical}
            exp_annotations: {summary: Token outflow exceeds the reviewed observation-window threshold}
      - eval_time: 2m
        alertname: AnonymoKeeperUnderfunded
        exp_alerts:
          - exp_labels: {job: anonymo-chain, component: keeper, severity: warning}
            exp_annotations: {summary: A chain keeper has less native gas funding than the reviewed minimum}
      - eval_time: 4m
        alertname: AnonymoAuthorityChanged
        exp_alerts: []
      - eval_time: 4m
        alertname: AnonymoKeeperUnderfunded
        exp_alerts: []
