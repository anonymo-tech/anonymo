<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Contact | Ledgerly</title></head>
<body>
  <nav><a href="/">Home</a><a href="/pricing">Pricing</a></nav>
  <main>
    <h1>Talk to us</h1>
    <form action="/contact" method="post">
      <label for="name">Name</label><input id="name" name="name" required maxlength="80">
      <label for="email">Work email</label><input id="email" type="email" name="email" required>
      <label for="topic">Topic</label>
      <select id="topic" name="topic"><option value="sales">Sales</option><option value="support">Support</option></select>
      <label for="message">Message</label><textarea id="message" name="message" required maxlength="1000"></textarea>
      <button type="submit">Send message</button>
    </form>
  </main>
</body>
</html>
